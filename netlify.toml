# Netlify config — Everything Hawaii Travel (static site generated by build.js)
[build]
  command = "node build.js"
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PWA manifest must be served as JSON or Chrome rejects it (Netlify defaults to octet-stream).
# Old singular /stay paths -> new Booking-style /stays funnel
[[redirects]]
  from = "/stay"
  to = "/stays/"
  status = 301
[[redirects]]
  from = "/stay/*"
  to = "/stays/:splat"
  status = 301

# Bare parent paths have no index page (only /tours/<slug>/ and /islands/<island>/
# exist) — send them to the Attractions hub instead of 404ing.
[[redirects]]
  from = "/tours"
  to = "/attractions/"
  status = 301
[[redirects]]
  from = "/tours/"
  to = "/attractions/"
  status = 301
[[redirects]]
  from = "/islands"
  to = "/attractions/"
  status = 301
[[redirects]]
  from = "/islands/"
  to = "/attractions/"
  status = 301

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Service worker: correct JS type, and never cache it so updates ship immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
